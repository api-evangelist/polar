- aid: polar:polar-daily-activity-deprecated-api
  name: Polar Daily activity (deprecated) API
  description: >-
    This resource allows partners to access their users' daily activity data. During the transfer, the
    activity data is copied also into the AccessLink database so the end-users cannot change the data
    that is accessible via AccessLink afterwards. Begin and end of day are determined by the time set
    on the device used. No timezone information is available. Each transaction will consist of at most
    50 activity summaries. Available data presented in section [Schemas](#schemas). Only data that has
    been uploaded to Flow after the user has been registered to your client will be available. Only data
    that has been uploaded in the last 28 days will be available. <br/><br/> This resource is deprecated.
    Please use non-transactional [Daily activity](#daily-activity) instead.
  humanURL: https://www.polar.com/accesslink-api/
  baseURL: https://www.polaraccesslink.com/
