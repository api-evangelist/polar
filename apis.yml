description: Polar Electro Oy (operating as Polar Global) is a Finnish sports and
  fitness technology company founded in 1977 and headquartered in Kempele, Finland.
  Polar invented the first wireless wearable heart rate monitor — the Sport Tester
  PE 2000 in 1982 — and remains one of the longest-standing brands in consumer heart
  rate sensing, GPS sports watches, and fitness wearables. The Polar device portfolio
  includes the H10 and H9 chest straps, the Verity Sense and OH1 optical sensors,
  the Polar 360 and Loop fitness bands, and the Vantage, Grit X, Pacer, Ignite, and
  Unite watch lines, along with a dedicated equine sensor line. Developers access
  Polar data through the Polar AccessLink API for consumer Polar Flow data, the Polar
  TeamPro API for team and player training sessions, and the open-source Polar BLE
  SDK for iOS and Android applications that stream live sensor data over Bluetooth
  Low Energy.
