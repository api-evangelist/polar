- type: Features
  data:
  - Polar AccessLink API with OAuth2 access to Polar Flow user training, activity,
    sleep, and biosensing data
  - Continuous heart rate (5-minute samples), Nightly Recharge, SleepWise alertness,
    and circadian bedtime endpoints
  - Cardio Load training-impulse calculation across days and months
  - Elixir biosensing endpoints — ECG, SpO2, body and skin temperature, skin contacts
  - Exercise downloads in JSON, FIT, TCX, and GPX formats
  - Webhook subscriptions for real-time delivery of new training, activity, and sleep
    data
  - Transactional endpoints (data is discarded after commit) and non-transactional
    persistent endpoints
  - Polar TeamPro API for coaches with team and player training session data
  - OAuth2 authorization-code flow with team_read scope for TeamPro and accesslink.read_all
    for AccessLink
  - Partner registration and OAuth credential management at admin.polaraccesslink.com
  - Polar BLE SDK for iOS (Swift) and Android (Kotlin/Java) streaming live HR, ECG,
    ACC, PPG, gyro, magnetometer, PPI
  - Supported sensors include H10, H9, Verity Sense, OH1, Polar 360/Loop, Vantage
    V3, Vantage M3, Grit X2 Pro, Pacer Pro
  - Heart-rate monitoring pioneer — first wireless wearable HR monitor (Sport Tester
    PE 2000, 1982)
  - Google Fit and Apple HealthKit integration paths for consumer data sharing
  - Dynamic rate limiting on AccessLink based on registered user count (15-minute
    and 24-hour windows)
  - TeamPro API rate limit of 1 request/second with 100-request burst
  - Polar Flow ecosystem (web at flow.polar.com plus iOS, Android, and Huawei mobile
    apps)
