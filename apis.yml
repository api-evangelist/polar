  - url: https://github.com/polarofficial/polar-ble-sdk
    name: Polar BLE SDK (iOS + Android)
    type: SDKs
  - url: https://github.com/polarofficial/create-mobile-app-for-polar-sensors
    name: Mobile App Starter for Polar Sensors
    type: CodeExamples
  description: >-
    The Polar BLE SDK enables iOS and Android applications to stream live data from Polar sensors over
    Bluetooth Low Energy. Supports H10, H9, Verity Sense, OH1, Ignite 3, Polar 360/Loop, Vantage V3, Vantage
    M3, Grit X2 Pro, Grit X2, Pacer Pro, and Pacer. Streams heart rate, ECG, accelerometer, PPG, gyroscope,
    magnetometer, and PPI data. iOS 14.0+ (Swift) and Android minSdk 24 (Kotlin/Java) with RxJava/RxSwift
    for asynchronous operations.
- aid: polar:polar-cardio-load-api
  name: Polar Cardio load API
  description: >-
    Cardio load is based on training impulse calculation (TRIMP), a commonly accepted and scientifically
    proven method to quantify training load. Your Cardio load value tells you how much strain your training
    session put on your cardiovascular system.  The higher the Cardio load, the more strenuous the training
    session was for the cardiovascular system.  Cardio load is calculated after every workout from your
    heart rate data and session duration. For more detailed information please check [cardio load](https://support.polar.com/e_manuals/unite/polar-unite-user-manual-english/cardio-load.htm).
  humanURL: https://www.polar.com/accesslink-api/
  baseURL: https://www.polaraccesslink.com/
  tags:
  - Cardio load
  properties:
  - type: OpenAPI
    url: openapi/polar-cardio-load-api-openapi.yml
