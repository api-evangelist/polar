- aid: polar:polar-continuous-heart-rate-api
  name: Polar Continuous Heart Rate API
  description: >-
    This resource allows partners to access their users' continuous heart rate data. Continuous heart
    rate is recorded with supported devices when the heart rate tracking is turned on in device settings.
    Samples are recording in 5 minute intervals. Heart rate samples from training sessions are not available
    through this resource. Training sessions samples have more precise sampling interval and they can
    be accessed from the [training data resource](#exercises). <a href="https://support.polar.com/en/support/the_what_and_how_of_polars_continuous_heart_rate">Supported
    devices</a>
  humanURL: https://www.polar.com/accesslink-api/
  baseURL: https://www.polaraccesslink.com/
