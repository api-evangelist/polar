      - name: to
        in: query
        description: 'Inclusive end date of range as ISO-8601 date string, example: "2023-10-28"'
        required: false
        schema:
          type: string
          format: date
      summary: Skin contacts data
      description: Get user's skin contacts data for last 28 days or for given date range. Maximum date range between from and to cannot be more than 28 days.
      responses:
        '200':
          description: Request was successful.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/skin-contact-period'
        '400':
          description: Invalid request.
        '401':
          description: Unauthorized.
        '204':
          description: No data found.
        '403':
          description: User has not accepted all mandatory consents.
      security:
      - OAuth2:
        - accesslink.read_all
  /v3/users/biosensing/ecg:
    get:
      tags:
      - Elixir&trade; Biosensing
      parameters:
      - name: from
        in: query
        description: 'Inclusive start date of range as ISO-8601 date string, example: "2023-10-01"'
        required: false
        schema:
          type: string
          format: date
      - name: to
        in: query
        description: 'Inclusive end date of range as ISO-8601 date string, example: "2023-10-28"'
        required: false
        schema:
          type: string
          format: date
      summary: Wrist ECG test result data
      description: Get user's wrist ECG test result data for last 28 days or for given date range. Maximum date range between from and to cannot be more than 28 days.
      responses:
        '200':
          description: Request was successful.
          content:
            application/json:
